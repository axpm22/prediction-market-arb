# Curated concept synonyms for the blocking stage (arb/nonsports/match.py).
# A text hits a concept if ALL tokens of any one phrase appear in it.
# Deterministic and auditable — extending this file is how coverage grows
# (rule 11: manual-first). City-scoped concepts stay city-scoped: a bare
# "temperature" phrase would pair Las Vegas with NYC.
unemployment: [["unemployment"], ["jobless", "rate"]]
cpi: [["cpi"], ["inflation", "rate"], ["consumer", "price", "index"]]
fed_decision: [["fomc"], ["fed", "rate", "decision"], ["federal", "funds", "rate"]]
retail_sales: [["retail", "sales"]]
gdp: [["gdp"]]
payrolls: [["payrolls"], ["nonfarm"]]
recession: [["recession"]]
gas_price: [["gas", "price"], ["gasoline"]]
high_temp_nyc: [["maximum", "temperature", "nyc"], ["highest", "temperature", "nyc"],
                ["high", "temperature", "new", "york"]]
high_temp_las_vegas: [["maximum", "temperature", "vegas"],
                      ["highest", "temperature", "vegas"],
                      ["las", "vegas", "max", "daily", "temperature"]]
high_temp_austin: [["highest", "temperature", "austin"],
                   ["maximum", "temperature", "austin"]]
low_temp_dc: [["lowest", "temperature", "dc"], ["dc", "min", "daily", "temperature"]]
high_temp_chicago: [["maximum", "temperature", "chicago"],
                    ["highest", "temperature", "chicago"]]
high_temp_miami: [["maximum", "temperature", "miami"],
                  ["highest", "temperature", "miami"]]
high_temp_denver: [["maximum", "temperature", "denver"],
                   ["highest", "temperature", "denver"]]
high_temp_philadelphia: [["maximum", "temperature", "philadelphia"],
                         ["highest", "temperature", "philadelphia"]]
high_temp_houston: [["maximum", "temperature", "houston"],
                    ["highest", "temperature", "houston"]]
high_temp_phoenix: [["maximum", "temperature", "phoenix"],
                    ["highest", "temperature", "phoenix"]]
named_storm: [["named", "storm"], ["hurricane", "landfall"],
              ["hurricane", "hits"], ["hurricane", "make", "landfall"]]
earthquake: [["earthquake"]]
jobless_claims: [["jobless", "claims"], ["initial", "claims"]]
# note (2026-07-12): PM's weather tag carries climate/disaster events, not the
# daily city temperatures Kalshi lists — the city-temp concepts above have no
# PM counterpart under current tags; disasters and econ are the overlap.
