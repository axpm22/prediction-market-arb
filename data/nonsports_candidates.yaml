  kalshi_text: Recession | Will there be a recession in 2026?
  pair_id: KXRECSSNBER-26|0xfdc73f10edf0266756686f35b5712cffa828b0940fc015e0426c76c934c2105d
  pm_date: '2027-01-31T00:00:00+00:00'
  pm_id: '0xfdc73f10edf0266756686f35b5712cffa828b0940fc015e0426c76c934c2105d'
  pm_rules: "This market will resolve to “Yes” if either of the following conditions is met:\n\n1.  The\
    \ seasonally adjusted annualized percent change in quarterly U.S. real GDP from the previous quarter\
    \ is less than 0.0 for two consecutive quarters between Q2 2025 and Q4 2026 (inclusive), as reported\
    \ by the Bureau of Economic Analysis (BEA). \n\n2.  The National Bureau of Economic Research (NBER)\
    \ publicly announces that a recession has occurred in the United States, at any point during 2025\
    \ or 2026, with the announcement made by the time the BEA releases the advance estimate for Q4 2026.\n\
    \nOtherwise, this market will resolve to \"No\". \n\nNote that advance estimates will be considered.\
    \ For example, if upon release, the advance estimate for Q3 2025 was negative, and the Q2 2025's most\
    \ recent, up-to-date estimate was also negative, this market would resolve to \"Yes\". If on December\
    \ 31, 2026 the latest estimate for quarterly GDP in Q3 2025 was negative, this market will stay open\
    \ until the Advance estimate of Q4 2026 is published, at which point it will resolve to \"Yes\" if\
    \ Q4 2026 was negative or if the NBER declares a recession by then.\n\nThe resolution source will\
    \ be the official announcements from the NBER and the BEA’s estimate of seasonally adjusted annualized\
    \ percent change in quarterly US real GDP from previous quarters as released by the Bureau of Economic\
    \ Analysis (BEA), https://www.bea.gov/data/gdp/gross-domestic-product"
