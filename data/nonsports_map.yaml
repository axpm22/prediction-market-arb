# Curated niche cross-venue map — weather, worldcup, macro. NOTHING is matched
# automatically. Each entry is hand-written after reading BOTH venues' rulebooks and
# recording their fields under `rulebook:`. An entry only goes live when:
#   enabled: true  AND  reviewed: true  AND  arb.experimental.niche.validate_entry approves
# (the validator proves both rulebooks resolve the SAME question). Until then it is ignored.
# Every niche flag is cross-venue => REVIEW, never auto-filled; settlement is manual:
#   python -m arb settle --manual nonsports:<id> <YES|NO>
#
# Templates below are disabled (enabled: false, reviewed: false). Fill real tickers/token
# ids and the rulebook fields from each venue's resolution criteria, then review + enable.

