# MODEL_FOUNDATIONS Phase B — cross-venue settlement equivalence, as data not vibes.
#
# sport -> scenario -> venue -> verdict, where verdict is one of:
#   SETTLES              — pays out on the game result (normal binary)
#   VOIDS                — refunds / 50-50 in this scenario
#   CONDITIONAL: <rule>  — depends on a stated condition (still counts as a filled cell)
#   UNKNOWN              — not yet checked against the venue's published rulebook
#
# Enforcement (settlement_matrix.section_green): a cross-venue pair is eligible for `trusted`
# ONLY if, for its sport, every scenario has no UNKNOWN and no venue disagreement across the
# venues involved. Any UNKNOWN or disagreement => permanent REVIEW with a scenario-named note.
# Every non-UNKNOWN cell should cite the rulebook section it came from (cite: ...).
# `arb reconcile` flips cells to observed reality when a settled cross-venue bet contradicts them.

baseball_mlb:
  extra_innings:
    kalshi: SETTLES        # cite: KXMLBGAME rules — final score after extra innings
    polymarket: SETTLES    # cite: Gamma MLB description — official final result
    sx: SETTLES
  suspended_game:
    kalshi: UNKNOWN
    polymarket: UNKNOWN
    sx: UNKNOWN
  postponement:
    kalshi: UNKNOWN
    polymarket: UNKNOWN
    sx: UNKNOWN
