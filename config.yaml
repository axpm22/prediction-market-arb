# ArbitrageModel config — every value the system reads (SPEC.md §15).
# Defaults are the V2-hardened values; comments are binding documentation.
timezone: America/New_York          # all daily boundaries EST/EDT
bankroll_usd: 1000
max_stake_pct: 0.10
ev_threshold: 0.02                  # display gate only; ev.e_min is the booking floor if re-opened
divergence_threshold: 0.03
push_pricing: false                 # optional Poisson push-prob scaling of integer-line edges (§8.3)
arb_stale_warn: 0.04                # ROI above this books REVIEW automatically for EVERY locked kind
                                    #   (ARB, XSPREAD, NEGRISK, POLITICAL, BTC) — stale quote or mismatch, not edge
max_leg_skew_secs: 60               # outer recording bound (actionable bound is execution.*)
max_start_drift_mins: 30            # venues disagreeing on start = match suspect
schedule_match_window_hours: 6      # MLB-schedule start-verify window (matching, §8.2)
settle_doubleheader_window_hours: 6 # same-pair finals ambiguity window (settle, §8.2);
                                    #   distinct from execution.doubleheader_cluster_tol_secs
match_suspect_prob_diff: 0.15       # same outcome priced >15pts apart = matching error
capital_charge_annual: 0.05         # locks below T-bill-ish carry are 'uneconomic'
sport_typical_duration_hours: { baseball_mlb: 3.5, basketball_nba: 2.5,
                                soccer: 2.0, tennis: 2.5, mma: 1.0,
                                basketball_wnba: 2.5, americanfootball_nfl: 3.5,
                                icehockey_nhl: 2.5, cricket: 8.0,
                                baseball_npb: 3.5, baseball_kbo: 3.5 }
                                # cricket spans ODI (~8h), T20 (~3.5h) and The
                                #   Hundred (~2.5h) in ONE canonical sport; 8.0 is
                                #   the conservative end — it only lengthens the
                                #   banksim lockup, never shortens it
venue_settlement_lag_hours: { kalshi: 24, polymarket: 48, sx: 24 }  # verify empirically
reconcile_give_up_days: 14          # past lag+this, an unresolved leg records
                                    #   UNRESOLVABLE and is never re-fetched (D5)
min_books_for_consensus: 3
min_books_for_consensus_totals: 2   # totals are line-fragmented
consensus_outlier_points: 0.10      # optional outlier drop: book >10pts from cross-book median excluded
                                    #   (disabled below 3 books; n=2 rows tagged thin-consensus)
devig_method: power                 # coin-flip default (n=30 bake-off is noise); re-run at n>=200
sharp_books: [lowvig, betonlineag]  # betus removed — soft book, not sharp
weight_sharp_books: false           # measurement-parallel until it beats plain median on CLV
consensus_anchor: { enabled: true, book: pinnacle, region: eu, markets: h2h }
                                    # single sharp anchor experiment (§18.3); h2h ONLY:
                                    #   420 credits/mo; h2h+totals = 540 > 500 budget (§6.4)
min_executable_usd: 50              # the only global per-leg depth floor
micro:                              # thin-book EV lane, SUBORDINATE to ev_enabled:
  enabled: true                     #   while ev_enabled is false, micro books nothing
                                    #   (would-be flags -> left_on_table)
  min_depth_usd: 5
  max_stake_usd: 25
  e_min: 0.08                       # edge floor at full depth...
  e_min_thin: 0.15                  # ...rising linearly as depth thins: interpolate from
                                    #   (min_executable_usd -> e_min) down to
                                    #   (micro.min_depth_usd -> e_min_thin) (pinned v3.4)
  assume_thin_venues: [sx]
  max_event_exposure_usd: 50
  max_venue_exposure_usd: 100
max_days_to_settlement: 14          # booking gate for resolution-settled bets; farther -> left_on_table
nonsports_max_days: 7               # resolution-settled non-sports only; locked-at-entry intra-market
                                    #   arbs (political lane) are EXEMPT — political markets run months
sports: [baseball_mlb, basketball_nba, basketball_wnba, americanfootball_nfl,
         icehockey_nhl, soccer, tennis, mma, cricket, baseball_npb, baseball_kbo]
                                    # activity gating is blind to sports missing here.
                                    # Expanded 2026-07-29 from the both-venue survey.
                                    # Cost measured before the change: kalshi 0.7s ->
                                    #   2.6s for 25 series (all single-page, no 429);
                                    #   polymarket unchanged at ~12s (soccer's 26
                                    #   /books chunks dominate and every tag fans out
                                    #   in parallel). Venues fetch concurrently, so
                                    #   the poll is still polymarket-bound. Adding a
                                    #   sport is ~free until a tag needs >10 gamma
                                    #   pages or kalshi starts answering 429.
                                    # MATCHING readiness differs per sport — see
                                    #   data/aliases.json; a sport with no alias
                                    #   entries persists quotes (rule 7) but produces
                                    #   no cross-venue pairs. Not a silent failure:
                                    #   every miss logs to logs/unmatched.log.
unreliable_start_venues: { polymarket: [tennis] }
activity_lookahead_hours: 48        # sport ACTIVE iff a venue lists a fixture in window
consensus_sports: [baseball_mlb]    # add tournament keys only while they run
odds_api_sport_aliases: { soccer_fifa_world_cup: soccer,
                          tennis_atp_wimbledon: tennis,
                          tennis_wta_wimbledon: tennis,
                          mma_mixed_martial_arts: mma }
odds_api_markets: { default: "h2h,totals",
                    tennis_atp_wimbledon: h2h, tennis_wta_wimbledon: h2h,
                    mma_mixed_martial_arts: h2h }
scan_breaks: true
break_windows: { basketball_nba: [48, 15], soccer: [45, 15] }  # [offset-mins-after-start, duration-mins]
                                    # NBA 48 is a placeholder — real halftime starts ~60-70
                                    #   wall-clock mins after tip; calibrate from stored quotes
watch_interval_secs: 60
consensus_enabled: true
ev_enabled: false                   # FROZEN by Phase A verdict; see PREREGISTRATION
consensus_max_age_hours: 8
consensus_pregame_max_age_hours: 3
ev:
  e_min: 0.05                       # booking floor when re-opened (display gate: ev_threshold)
  clv_window_mins: 30               # closing mid = last consensus within this window of start
  kelly_fraction: 0.25
  edge_suspect_above: 0.25          # above = quarantine as data error
  max_edge: 0.15                    # above = record quote, book nothing
  require_exact_match: [tennis, mma]  # golf removed — not a supported sport anywhere in the system
  enforce_depth_floor: true
  reject_one_sided_books: true
regrade:                             # §18.3 arb regrade: read-only paired-Brier re-scoring
  match_tolerance_secs: 90           # as-stored: max |consensus.computed_at - quote.fetched_at|
  bootstrap_n: 2000                  # cluster-bootstrap resamples (event_key clusters)
  bootstrap_seed: 20260714           # pinned before any data was scored (pre-registered honesty)
  min_events: 50                     # below this per (method,basis) cell -> INSUFFICIENT, no claim
scan_times: ["06:15", "10:30", "13:30", "18:30"]
                                    # v3.4: retimed so the 3h freshness windows cover modal
                                    #   MLB starts (13:05-13:40, 18:40-19:10 ET); the old
                                    #   10:00/15:00/19:00 grid left 13:00-15:00 and
                                    #   18:00-19:00 dead (§13.1 booking rule)
daily_report_time: "23:59"
settle_time: "09:30"
archive_time: "04:40"               # daily; after the backup (04:10) so the day's data is copied first
archive_after_days: 7               # quotes older than this move to data/archive/ (H8, §13.3).
                                    #   FLOOR: must exceed the markout window (<=1h) with wide margin
                                    #   AND the lead-lag study horizon — leadlag.build_series reads all
                                    #   HOT quotes unbounded, so this IS its lookback. 7d keeps a week
                                    #   of quotes hot for the study; archives preserve the rest (rule 7).
settle_days_from: 3                 # Odds API scores max lookback
settle_tripwire_secs: 60            # instant-settle = knowable at placement
tracker:
  terminal_mute_grace_mins: 180
  max_reappearances: 10             # NOT observability — this SUPPRESSES booking (see
                                    #   reappearance_cap(); scaled by cadence)
  dead_checks: 3                    # consecutive missed sightings before a lifetime closes.
                                    #   Measured 2026-07-29 against the production DB: of 103
                                    #   watch-lane closures, 15 (14.6%) re-minted a new
                                    #   flat_bets row for the same fingerprint within ~2 polls
                                    #   — bookkeeping deaths, not edges closing.
                                    #   Also bounds the venue-fetch-gap carry (bet 126 was
                                    #   carried 300 polls by a chronically-down sx).
  reappearance_ref_interval_secs: 60   # max_reappearances is a rows-per-24h RATE, and rows
                                       #   scale with poll rate. The cap is defined at this
                                       #   reference cadence and scaled by the configured one,
                                       #   so dropping watch_interval_secs cannot silently
                                       #   start suppressing flags.
mlbstats_enabled: true
auto_fill: false                    # permanently false; flat_bets is the executor
trusted_pairs: []                   # empty until the §18.2 gate clears — weeks by construction
clean_lane_excluded_venues: [sx]    # a venue that cannot support a position never reaches
                                    #   clean, whatever the kind. SX: 0 of 356,595 stored
                                    #   quotes carry a bid (no unwind, no markout),
                                    #   reconcile._sx returns None unconditionally because
                                    #   settled-status semantics are unverified (so no
                                    #   certificate can accrue), and the chain is being
                                    #   deprecated. Empty the list to re-enable.
fuzzy_match_threshold: 92
fee_stale_days: 30                  # fees are dated facts; stale = badge, never halt
kalshi:      { fee_rate: 0.07, maker_fee_rate: 0.0175,   # maker = 25% of taker, NOT zero
               source_url: "https://kalshi.com/docs/kalshi-fee-schedule.pdf",
               confirmed_on: 2026-07-02 }
polymarket:  { sports_fee_rate: 0.03, crypto_fee_rate: 0.07, politics_fee_rate: 0.04,
               econ_weather_fee_rate: 0.05, geopolitics_fee_rate: 0.0, fee_rate: 0.05,
               source_url: "https://docs.polymarket.com/trading/fees",
               confirmed_on: 2026-07-02 }   # QUADRATIC per category; makers 0
sx:          { fee_rate: 0.0, win_fee_rate: 0.0,   # singles free; 5% winning PARLAYS only
               source_url: "https://help.sx.bet/en/articles/2798017-sx-bet-fees",
               confirmed_on: 2026-07-02 }
execution:
  taker_price_buffer: 0.005         # half-cent per contract vs latency/queue risk
  slippage_model: flat              # 'ladder' is a versioned change to every cost vector
  fillable_fraction: 1.0            # flip toward 0.5 once live fills calibrate it
  fixed_cost_per_fill_usd: { kalshi: 0.0, polymarket: 0.02, sx: 0.02 }
                                    # gas/redemption/withdrawal amortization; projections only — verify
  arb_size_by_ladder: false         # §18.4 gate
  arb_size_safety_frac: 0.5
  min_ladder_fraction: 0.5          # capacity says UNKNOWN below this
  max_actionable_skew_secs: 10
  max_spread_fraction_of_edge: 1.0  # sum of leg half-spreads must not exceed this multiple
                                    #   of the edge. At 1.0: if crossing costs more than the
                                    #   edge, it is not an opportunity at any size. Measured
                                    #   2026-07-29: one CPI pair was flagged 234x with a
                                    #   1.52c edge inside an 11c Kalshi spread, which the
                                    #   zombie guard cannot see (it needs volume==0 AND a
                                    #   >=90c spread, catching 0.76% of dead books).
  venue_fetch_timeout_secs: 15      # per-REQUEST timeout (one GET/POST)
  venue_deadline_secs: 30          # per-VENUE wall-clock budget across all its paginated
                                    # requests (H7); on expiry the venue returns partial + ok:false
  max_requests_per_sec: 0           # DISABLED 2026-07-29 — see below. GLOBAL across every lane and one-off pull, enforced
                                    #   cross-process via flock (.locks/request_pace). The
                                    #   limit is per IP: measured 2026-07-29, a bare loop at
                                    #   ~3 req/s took a 429 within two calls, while 2.3 req/s
                                    #   sustained 47,000 requests with 3 total 429s.
                                    #   0 disables (tests, offline replay).
                                    # DISABLED after causing a ~2h watch-lane outage
                                    #   2026-07-29: the flock is held across its sleep, PM
                                    #   fans 9 threads per cycle, so cycles began exceeding
                                    #   their 60s interval, overlapped, and contended with
                                    #   themselves — congestion collapse. Venue fetches went
                                    #   32s -> 151s as the deadline was raised, i.e. failing
                                    #   slower, not succeeding. Shaping demand needs the
                                    #   SPEEDPLAN tiered cadence (hot fast / warm slow), not
                                    #   a global choke in front of an unchanged workload.
  venue_max_retries: 2              # 429/5xx backoff with jitter, then poll partial for venue
  tls_block_cache_secs: 300         # ANJ-block fast-fail: SSL cert failure blocks the host this
                                    # long (cache, not ban — re-probed after, no restart to recover)
  min_adj_edge_points: 0.002        # NB: "points" = probability FRACTION (0.002 = 0.2pts),
                                    #   never percentage points — unit bug = 100x error
  line_velocity_points_per_sec: { default: 0.001, baseball_mlb: 0.0008,
                                  basketball_nba: 0.0015 }
                                    # fractions/sec; pre-registered PLACEHOLDERS — re-estimate
                                    #   from the lead-lag lane's stored per-event mid changes
  doubleheader_cluster_tol_secs: 7200
odds_api: { region: us, warn_below_credits: 100, abort_below_credits: 50 }
negrisk:
  enabled: true
  min_edge: 0.006                   # dry-run patch A1: MUST exceed p_tail/(1-p_tail) where
                                    #   p_tail = 1 - exhaustive_proof.mids_sum_min, or the
                                    #   proof tolerance admits worst-case-NEGATIVE baskets
                                    #   into the headline; loader enforces the inequality
  scan_no_side: true                # also flag sum(NO asks) < N-1 baskets
  kalshi_events: true               # also scan Kalshi event_ticker groups of mutually exclusive markets
  kalshi_event_checks: 40           # /events/{ticker} lookups per scan, largest groups first
  require_exhaustive_exclusive: true  # enforced by the §8.4 proof below, never assumed
  exhaustive_proof:
    require_venue_flag: true          # Polymarket negRisk flag / Kalshi event mutually_exclusive (verify per rule 3)
    mids_sum_min: 0.995               # dry-run patch A1: tolerated tail (1 - this) must sit
                                      #   below min_edge; 0.98 tolerated a 2% tail against a
                                      #   0.5pt edge floor = negative-EV baskets booked clean
    mids_sum_max: 1.10                # above this = overlapping outcomes or stale books -> REVIEW
    max_half_spread_sum: 0.005        # dry-run patch A2: proof invalid if summed half-spreads
                                      #   exceed the window slack (1 - mids_sum_min) — noisy
                                      #   mids can mask a tail larger than the tolerance;
                                      #   loader asserts equality with (1 - mids_sum_min)
    require_two_sided_all_outcomes: true  # any listed outcome without a live two-sided book
                                          #   -> unproven-exhaustive (v3.4)
  max_outcomes: 30
  scan_limit: 200
  scan_pages: 10                    # paginate; V1's page cap hid most of the surface
                                    #   (10 = the previously hardcoded adapter cap; the
                                    #   old value 3 was never read — review 2026-07-10)
  min_executable_usd: 5             # single-venue: thin baskets worth measuring
btc_arb:
  enabled: false                    # enable only WITH its settlement path + oracle-agreement study
  window_match_secs: 5
  max_window_minutes: 15
  trusted: false
parlay: { enabled: false, divergence_threshold: 0.05, min_liquidity_usd: 500,
          sx_win_fee_rate: 0.05 }
ai_matcher:
  enabled: false                    # enable after ground-truth set exists (§18.5)
  model: claude-haiku-4-5
  min_confidence: 0.85
  max_new_pairs_per_day: 900        # API-classified pairs only (shape verdicts are free
                                    #   and unlimited; the cap is Anthropic spend) — covers
                                    #   three 257-pair sweeps/day (~$0.40 each)
  max_rules_chars: 8000
  paper_fill: true
  paper_stake_usd: 1
nonsports:
  watch_interval_secs: 300
  gamma_scan_pages: 20              # Gamma pagination cap for BOTH the political lane and the
                                    #   matcher's PM side. 2→20 on 2026-07-30: the politics tag
                                    #   holds 1558 open events (measured), so the effective
                                    #   1000-event cap hid 36% of the surface. 20*100 leaves
                                    #   headroom. Costs fetch time, not credits (keyless).
  match_date_window_days: 14        # blocking stage: resolution dates within this. 3→14 on
                                    #   2026-07-30 after measuring the rejected-gap histogram:
                                    #   403 pairs at <=3d, 36 at 3-7d, 35 at 7-14d, then a
                                    #   cliff (523 at 14-31d, 3670 at >31d — genuinely
                                    #   different contract months). 14 harvests the 71-pair
                                    #   shoulder and stops before the cliff. Recall only: the
                                    #   shape prefilter, Haiku, and rule 11's REVIEW lane all
                                    #   still adjudicate downstream.
  max_candidates: 1000              # per matcher run. 400→1000 on 2026-07-30: the uncapped
                                    #   blocker returned 403, so the old cap was binding by 3
                                    #   and silently cut the alphabetically-last concept.
  max_series_fetch: 250             # kalshi series whose open markets get pulled. Raised from
                                    #   150 on 2026-07-30: 223 series hit the concept map and
                                    #   the run logged 'exceed max_series_fetch; truncating',
                                    #   so weather/econ/politics coverage was silently clipped.
  series_fetch_workers: 8           # thread-pool width for the per-series market GETs
                                    #   (I/O-bound fan-out; 150 sequential GETs blew the
                                    #   240s match deadline — truncation observed 2026-07)
  match_deadline_secs: 240          # wall-clock budget for one matcher run
                                    #   (batch command, not a poll)
  candidate_threshold: 85
  kalshi_categories: ["Politics", "Economics", "Climate and Weather"]
  polymarket_tags: [politics, economy, weather]
verify: { poll_secs: 10, max_bet_age_secs: 900 }
hot:    { poll_secs: 2, check_interval_secs: 1.0, watch_duration_secs: 900,
          dead_checks: 3, max_watchers: 3 }   # 900s: 120s right-censored every lifetime
scoring:                            # consumed by §18.3 segment gating (regrade/report)
                                    # v3.3: the weighted composite score is DROPPED — an
                                    #   arbitrary 0.40/0.25/0.20/0.15 blend is researcher
                                    #   degrees of freedom; segments pass or fail the §18.3
                                    #   hard gates (Wilson, CLV, ECE, n) independently
  score_min_n: 30
  block_below: 30
  recent_window: 10
  calibration_gate: true            # ECE gate blocks a segment even if ROI passes
  ece_estimator: debiased           # v3.4: raw ECE has a noise floor — under PERFECT
                                    #   calibration E[ECE] ~= sqrt(2/pi) * sum_b w_b *
                                    #   sqrt(p_b(1-p_b)/n_b) ~= 0.06 at n=200 / 5 bins,
                                    #   nearly the old 0.10 gate; gate on ECE_raw - E0
  ece_max: 0.05                     # on the DEBIASED estimator (~= the old raw-0.10 intent)
  ece_bins: 5                       # quantile bins; 10 equal-width bins at n=200 flap
sizing: { kelly_fraction: 0.25, max_kelly_fraction_of_bankroll: 0.05 }
validation:
  ev_filter: { rule_id: H-EVFILTER, kind: EV, min_cost: 0.40, max_cost: 0.75,
               max_flagged_edge: 0.02, target_n: 1200, halfway_n: 600,
               kill_consecutive_losses: 10 }
               # target_n raised 190 -> 1200 (~600 effective events at n_eff ~ n/2)
               # per the §18.5 power decision, resolved 2026-07-08 BEFORE first
               # live poll: detect a modest 0.55 win rate, not only >= 0.65.
               # See PREREGISTRATION.md.
supervisor:
  processes: { watch: true, live: true,    # add lanes deliberately, one at a time
               negrisk: true, political: true,    # non-sports pivot (plan Phase 2)
               mapped: true,                      # adjudicated cross-venue pairs
               verify: true }                     # 10s re-quote of fresh locked flags.
                                                  #   Implemented since Phase 7 and never
                                                  #   run: 1 annotation in 21 days. Keyless
                                                  #   Kalshi/PM reads only (rule 2 safe).
  commands:  { watch: "watch --once", live: "live --once",
               negrisk: "negrisk-scan --once", political: "political --once",
               mapped: "mapped --once", verify: "verify --once" }
  max_child_runtime_secs: { default: 600, settle: 1800, live: 120, verify: 30 }
                                    #   verify polls at 10s — a 30s child is already hung
                                    # per-process; settle+reconcile runs long;
                                    #   a live cycle past 120s is force-restarted
  schedule_catchup_grace_mins: 30   # on (re)start, only fire scheduled slots missed within
                                    #   this window; older slots are marked done, not burst-fired (H9)
  stagger_secs: 15                  # boot offset between lanes — lockstep fan-out
                                    #   quadrupled kalshi latency (2026-07-14)
  shape_time: "05:00"               # weekly (Monday) shape-check fire time
  cadence_windows: {}               # optional per-lane time-of-day cadence, NY hours:
                                    #   { watch: [[19, 23, 20]] } polls watch every 20s
                                    #   from 19:00 to 22:59 and at watch_interval_secs
                                    #   otherwise. Triples are [start_hr, end_hr, secs],
                                    #   start inclusive, end exclusive; first match wins.
                                    #   EMPTY BY DEFAULT — measured yield (hr20: 482 flags
                                    #   /1k polls vs hrs 04-08: 3 flags in 1,816 polls) says
                                    #   this should be used, but the numbers are a
                                    #   pre-registered policy decision, not a code default.
data_stale_alarm_secs: 900
heartbeat_stale_polls: 3            # supervisor beat older than this many watch
                                    #   intervals reads STALE (status + dashboard)
clock_skew_alarm_secs: 5            # status alarms if NTP offset exceeds this
log_retention_days: 90              # rotate daily; forensics greps these
db_backup: { time: "04:10", dest: "backups/", keep_last: 14 }   # sqlite3 .backup daily;
                                    # prune to keep_last newest after each backup (H8); report prints age
                                    # dest MUST be a different disk or synced folder (§13.3);
                                    #   a same-volume dest is a startup WARNING (v3.4)
canary: { enabled: true, day_of_month: 1, time: "05:30" }   # monthly synthetic
                                                 #   end-to-end fixture, tagged lane
dashboard: { host: 127.0.0.1, port: 8722 }       # read-only local panel (§14.3); GETs only,
                                                 #   never bound beyond localhost
tape_check: { enabled: true, window_secs: 60 }   # fill tape_confirmed only if venue printed a trade
                                    #   at-or-through the fill price in-window (verify endpoints, rule 3)
max_lead_hours: 12                  # a covering pair flagged further than this before the
                                    #   event starts is REVIEW-only. Measured 2026-07-28:
                                    #   legs flagged >48h out have a median 24h volume of 3
                                    #   vs 211,365 within 6h, and half are zero — early lines
                                    #   nobody trades. 89 of 125 ledger flags were this class.
                                    #   Demote, never drop (rule 7 keeps the row).
zombie_spread_min: 0.90             # volume_24h==0 AND (ask-bid)>=this -> zombie tag, non-actionable
risk_free_rate: { value: 0.043, source_url: "TODO-13wk-T-bill", confirmed_on: 2026-07-07 }
                                    # dated fact like fees [VERIFY at build] (v3.5)
deployment:                         # capital-deployment layer (addendum §2-§6); paper unaffected
  annualized_hurdle: 0.20
  xspread_autobook: false           # STRUCTURAL: floor max(2F,0.5%) > ceiling F+0.5% for all F>0.5%
  auto_book_min_net_edge: "max(2*total_fees, 0.005)"   # same-venue ARB only
  leg_failure_suspend_rate: 0.20
  fok_window_secs: 5
slippage: { max_edge_fraction: 0.20, depth_divisor: 5 }
mc_sim: { n_bets: 1000, block: sport_day, ruin_threshold: 0.5, max_ruin_prob: 0.01,
          min_history_bets: 300 }
mismatch_pricing: { lgm: 1.0, rule_of_three: true }    # p_upper = 3/n mismatch-free positions
caps: { per_event_frac: 0.05, per_sport_frac: 0.10, per_day_totals_frac: 0.15 }
kind_taxonomy: { cross_venue: XSPREAD, same_venue_locked: ARB }   # RULE 1 (v3.5)
live_lane:                          # in-play paper lane (prompts/PROMPT_LIVE_LEADLAG.md);
  enabled: true                     #   review-lane FOREVER by classify(); kill gate in
                                    #   PREREGISTRATION.md flips this false by dated amendment
  cadence_secs: 20                  # live cycle target; achieved cadence printed per cycle
  shortlist_max_events: 12          # the shortlist, not the board
  max_game_hours: { baseball_mlb: 5.0, basketball_nba: 3.5, soccer: 3.0,
                    tennis: 5.0, mma: 2.0, basketball_wnba: 3.5,
                    americanfootball_nfl: 4.5, icehockey_nhl: 4.0,
                    cricket: 10.0 }   # past this cap an event leaves the shortlist
  max_actionable_skew_secs: 3       # tighter than pregame (10s) — in-play moves faster
  line_velocity_points_per_sec: { default: 0.003, baseball_mlb: 0.002,
                                  basketball_nba: 0.004 }
                                    # PLACEHOLDERS — re-estimated by the leadlag lane (B4)
  kill:                             # pre-registered kill gate (PREREGISTRATION.md)
    max_days: 30
    min_flags: 300
    confirm_rate_floor: 0.10
leadlag:                            # lead-lag study (read-time, stored quotes only)
  min_move_points: 0.01             # |Δmid| >= this is a "move" (probability fraction)
  match_window_secs: 60             # same-sign moves at two venues within this window match
  tie_epsilon_secs: 5               # |Δt| <= this is a TIE: within one poll cycle the
                                    #   fetch ORDER (kalshi ~0.7s vs PM ~15s) stamps the
                                    #   earlier time, not market leadership (2026-07-09)
  max_lag_polls: 5                  # cross-correlation lag range [-K, +K] polls
  min_matched_moves: 100            # gate: below this, no claim either way
  min_events: 50
exit:                               # SELL engine (§10.8): read-time counterfactual columns,
  enabled: true                     #   pure function of stored quotes — no ledger writes
  policies: [hold, take_profit, trailing]
  capture_fraction: 0.8             # P1: sell once 80% of the flagged edge is banked in price
  trail_fraction: 0.4               # P2: sell on a 40% drawdown from peak unrealized P&L
  min_peak_edge_fraction: 0.5       # P2 arms only after peak >= 50% of flagged edge
  exit_price_basis: bid_minus_fee   # sells cross the spread AND pay the taker fee
  promote_requires: { min_n: 100, ci_excludes_zero: true, replication_month: true }

bench:                              # STRATEGIES.md lane bench: measure every surviving
                                    #   lane on data we hold, then rank (§4 queue, empirical)
  db: data/kalshi_history.sqlite    # retrospective Kalshi corpus; NEVER the ledger DB (rule 9)
  request_pace_secs: 0.35           # bulk backfill against a free public endpoint: stay far
                                    #   under the assumed 20 req/s; get_json backs off on 429
  max_event_pages: 60               # settled-EVENT pages walked for the series->category map
  max_market_pages: 20              # settled-MARKET pages per series (1000/page)
  max_series_per_category: 25        # stratified cap — a global top-N collapses into sports
  max_candle_markets: 40000          # one request each; the corpus's whole cost is here
  max_candle_per_series: 400         # sample WITHIN series: a global volume sort fills the
                                    #   budget with 15-minute crypto and leaves L8 no
                                    #   long-horizon, non-crypto cell to measure
  tape_db: data/kalshi_tape.sqlite   # separate file: one writer per SQLite DB, and the
                                    #   candle pull holds the corpus write lock
  max_trade_markets: 2500           # L11 tape: one request each, run alongside candles
  large_print_percentile: 90        # a 'large' print is this percentile WITHIN its market
  markout_trades_ahead: 10          # follower markout horizon, in prints
  min_volume_fp: 100                # never-traded markets carry no price to calibrate
  candle_period_mins: 60
  max_candle_periods: 5000          # venue cap: >5000 periods per request answers 400
                                    #   (verified 2026-07-27); older history is truncated, not lost
  horizon_hours: 24                 # T-delta snapshot: last executable ask this long pre-close
                                    #   (rule 11 unit rule: ONE observation per market)
  price_bands: [0.0, 0.10, 0.30, 0.50, 0.70, 0.90, 1.0]   # coarse, pre-registered (rule 12)
  primary_band: [0.0, 0.10]         # L8 primary cell: the longshot band, where the
                                    #   favorite-longshot literature puts the effect
  max_spread: 0.10                  # an ask with no bid within this is a quoted price,
                                    #   not an executable one (fake-arb class 3/8)
  tail_band: 0.97                   # L6 cohort entry: traded at or above this
  n_min_units: 600                  # decision-grade standard (600 effective events)
  null_band: 0.01                   # |effect| CI inside this => decisive NULL, lane is dead
  ci_z: 1.96
  anj_probe_file: data/anj_probe.json   # cached L9 probe; absent => lane BLOCKED
  anj_probe_sport: baseball_mlb     # one in-season sport; the probe is descriptive telemetry
  anj_probe_region: fr              # L9: winamax/betclic/unibet/pmu/netbet (verified in docs)
  anj_probe_markets: h2h
  credits_per_month:                # B1 line items; a lane without one does not run
    L1: 0
    L2: 0
    L3: 60
    L4: 120
    L5: 90
    L6: 0
    L7: 0
    L8: 0
    L9: 8
    L10: 0
    L11: 0

maker:                              # maker-side measurement lane (2026-07-30). Taking always
                                    #   pays the spread, which is 13x the edge on the one
                                    #   fully-measured cover; this lane measures EARNING it.
  tape_db: data/pm_tape.sqlite      # own SQLite file: rule 9 cannot be reached from here
  record_secs: 3600                 # one recording session's wall clock
  max_tokens: 60                    # WS subscription width; 50 tokens produced ~108k frames
                                    #   in 7 minutes, so this bounds tape size not coverage
  min_price: 0.10                   # contested markets only: a book at 0.002/0.998 is
  max_price: 0.90                   #   resolved and can never produce a maker fill
  markout_horizons_secs: [30, 120, 600]
  min_fills_for_verdict: 100        # below this the bracket is reported but never scored

scale_in:                             # add to a live arb that is still there and BETTER
  enabled: true
  min_edge_widening: 1.2              # only add at >=1.2x the first-seen edge. Adding on mere
                                      #   persistence re-buys a ghost: 54% of arbs visible >=5
                                      #   polls never change their edge at all (stale quote)
  require_edge_moved: true            # a frozen edge is a frozen book, not a standing invitation
  max_tranches: 3                     # per position_key, NOT per flag — tracker.max_reappearances
                                      #   is 10, which would let one stale arb eat the bankroll
  max_position_frac: 0.5              # all tranches of one position_key, as a share of bankroll
